name: kit-sync
# budget: ~1 min per day (one shallow clone of the public main repository, one commit when the kit changed)
# trigger: daily and dispatch; the kit changes only when main merges a seed/ change, so daily is enough (never faster)
# free-alternative: the tick Worker's main writer can push the same tree; this job needs no credential a person mints
# TEMPLATE-CODE-ONLY-1: this repository is the code-only template; its tree is the seed/ folder of ultrastable/ultrastable.
on:
  schedule: [{ cron: "41 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: { group: kit-sync, cancel-in-progress: false }
# KIT-SYNC-2 (2026-11-25): the first version failed every run for 3 days without anyone seeing it. It deleted files that only this repo had,
# and pushed workflow changes straight to main, which the built-in token is refused. Now: copy without deleting, never touch workflow files
# (they are reported as drift instead), go through a pull request the lane merges, and exit 1 with a plain reason on any failed step.
jobs:
  sync:
    if: github.repository == 'ultrastable/seed' && vars.HALT != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Copy seed/ from the public main repository onto a branch
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ultrastable/ultrastable.git /tmp/main || { echo "::error::kit-sync: clone of ultrastable/ultrastable failed"; exit 1; }
          src=$(git -C /tmp/main rev-parse --short HEAD)
          rsync -a --exclude=__pycache__ --exclude=.github/workflows /tmp/main/seed/ ./
          drift=$(diff -rq /tmp/main/seed/.github/workflows .github/workflows | grep -v kit-sync.yml || true)
          [ -n "$drift" ] && echo "::warning::kit-sync: workflow files differ from upstream and are left alone: $drift"
          git add -A
          if git diff --cached --quiet; then echo "kit unchanged at ultrastable/ultrastable@$src"; exit 0; fi
          git config user.name "ultrastable-kit-sync"
          git config user.email "kit-sync@users.noreply.github.com"
          git checkout -B kit-sync/auto
          git commit -m "kit-sync: seed/ from ultrastable/ultrastable@$src (TEMPLATE-CODE-ONLY-1)"
          git push -f origin kit-sync/auto || { echo "::error::kit-sync: push of branch kit-sync/auto refused"; exit 1; }
          gh pr view kit-sync/auto --json state -q .state 2>/dev/null | grep -q OPEN || \
            gh pr create --head kit-sync/auto --base main --label handoff --title "kit-sync: seed/ from ultrastable/ultrastable@$src" \
              --body "Automatic copy of seed/ from ultrastable/ultrastable@$src. Files that exist only here are kept; workflow files are never changed by this job." \
            || gh pr create --head kit-sync/auto --base main --title "kit-sync: seed/ from ultrastable/ultrastable@$src" --body "Automatic copy of seed/ from ultrastable/ultrastable@$src."
